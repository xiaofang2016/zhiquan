version: 0.0
os: linux
files:
  - source: /
    destination: /var/local/sport-crawl
file_exists_behavior: OVERWRITE
hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 120
      runas: root
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 900
      runas: root
  ValidateService:
    - location: scripts/validate.sh
      timeout: 180
      runas: root
