version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
      nodejs: 20
  build:
    commands:
      - cd web && npm ci && npm run build && cd ..
      - mvn -B -DskipTests package
  post_build:
    commands:
      - mkdir -p output/scripts
      - cp sport-crawl-worker/target/sport-crawl-worker-1.0.0.jar output/worker.jar
      - cp sport-crawl-api/target/sport-crawl-api-1.0.0.jar output/api.jar
      - cp sport-crawl-db/target/sport-crawl-db-1.0.0.jar output/db.jar
      - cp Dockerfile docker-compose.yml docker-compose.db.yml appspec.yml output/
      - cp scripts/*.sh output/scripts/
      - chmod 755 output/scripts/*.sh
      - mkdir -p output/site/web
      - cp -a web/dist/. output/site/web/
      - rm -rf /tmp/sport-crawl-web
      - mkdir -p /tmp/sport-crawl-web
      - cp -a web/dist/. /tmp/sport-crawl-web/
      - cp web/index.mjs /tmp/sport-crawl-web/index.mjs
      - ( cd /tmp/sport-crawl-web && zip -qr /tmp/sport-crawl-web.zip . )
      - aws lambda wait function-updated --function-name sport-crawl-web
      - |
        VER=$(aws lambda update-function-code --function-name sport-crawl-web --zip-file fileb:///tmp/sport-crawl-web.zip --publish --query Version --output text)
        CUR=$(aws lambda get-alias --function-name sport-crawl-web --name live --query FunctionVersion --output text)
        mkdir -p output/lambda-out
        cat > output/lambda-out/appspec.yml << EOF
        version: 0.0
        Resources:
          - sport-crawl-web:
              Type: AWS::Lambda::Function
              Properties:
                Name: sport-crawl-web
                Alias: live
                CurrentVersion: "$CUR"
                TargetVersion: "$VER"
        EOF
artifacts:
  base-directory: output
  files:
    - '**/*'
  secondary-artifacts:
    build:
      base-directory: output 
      files:
        - '**/*'
    lambda:
      base-directory: output/lambda-out
      files:
        - appspec.yml