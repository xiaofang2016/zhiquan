version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
  build:
    commands:
      - mvn -B -DskipTests package
  post_build:
    commands:
      - mkdir -p output/scripts
      - cp sport-crawl-worker/target/sport-crawl-worker-1.0.0.jar output/worker.jar
      - cp sport-crawl-api/target/sport-crawl-api-1.0.0.jar output/api.jar
      - cp Dockerfile docker-compose.yml appspec.yml output/
      - cp scripts/*.sh output/scripts/
      - chmod 755 output/scripts/*.sh

artifacts:
  base-directory: output
  files:
    - '**/*'
