server:
  port: 8892

spring:
  application:
    name: sport-crawl-api

sport:
  aws:
    region: ${AWS_REGION:ap-northeast-1}
    league-table: sport_league
    date-table: sport_match_date
    match-table: sport_match
    image-table: sport_image
    image-bucket: sport-crawl-images-562904761216
    image-prefix: images/
    chat-prefix: chat/
    db-prefix: database/
    db-table: sport_db_doc
    community-prefix: community/
    mall-prefix: mall/
    user-table: sport_user
    zhiquan-chat-table: zhiquan_chat
    zhiquan-chat-partition: apk#5739998
  community:
    base-url: https://kzb001.net
    public-base: https://dgtplaoir00la.cloudfront.net
  auth:
    token-secret: ${SPORT_AUTH_TOKEN_SECRET}
    token-days: 30
  admin:
    key: ${SPORT_ADMIN_KEY:}
  sms:
    url: ${SPORT_SMS_URL:https://nexsms.ai/api/v1/sms/send}
    secret-name: ${SPORT_SMS_SECRET:prod/nexsms}
    template: ${SPORT_SMS_TEMPLATE:CN_OTP}
    resend-seconds: 60
    expire-seconds: 300
  jxt:
    base-url: ${SPORT_JXT_BASE_URL:https://api.jixsports.com}
    boxim-secret-name: ${SPORT_JXT_BOXIM_SECRET_NAME:prod/jxt-boxim}
  ued:
    base-url: ${SPORT_UED_BASE_URL:https://api.jixsports.com}
    boxim-secret-name: ${SPORT_UED_BOXIM_SECRET_NAME:prod/jxt-boxim}
