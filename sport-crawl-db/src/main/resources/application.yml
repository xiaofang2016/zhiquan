server:
  port: 8893

spring:
  application:
    name: sport-crawl-db
  task:
    scheduling:
      pool:
        size: 4

sport:
  aws:
    region: ${AWS_REGION:ap-northeast-1}
    league-table: sport_league
    date-table: sport_match_date
    match-table: sport_match
    image-table: sport_image
    image-bucket: sport-crawl-images-562904761216
    image-prefix: images/
    chat-prefix: chat/
    db-prefix: database/
    db-table: sport_db_doc
    community-prefix: community/
    mall-prefix: mall/
  community:
    enabled: true
    base-url: https://kzb001.net
    public-base: https://dgtplaoir00la.cloudfront.net
    pages: 20
    page-size: 20
    essence-pages: 3
    circle-pages: 2
    comment-page-size: 50
    comment-pages: 10
    request-interval-ms: 200
  mall:
    enabled: true
    page-size: 50
  database:
    enabled: true
    base-url: https://kzb001.net
    zone-id: Asia/Shanghai
    request-interval-ms: 200
    history-budget: 400
    history-scan-cap: 2000
