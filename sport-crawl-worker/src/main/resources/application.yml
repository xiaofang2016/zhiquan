server:
  port: 8891

spring:
  application:
    name: sport-crawl-worker
  task:
    scheduling:
      pool:
        size: 4

sport:
  aws:
    region: ${AWS_REGION:ap-northeast-1}
    league-table: sport_league
    date-table: sport_match_date
    match-table: sport_match
    image-table: sport_image
    image-bucket: sport-crawl-images-562904761216
    image-prefix: images/
  crawl:
    enabled: true
    backfill-on-start: true
    base-url: https://kzb001.net
    zone-id: Asia/Shanghai
    request-interval-ms: 200
    page-size: 200
    fallback-page-size: 20
    max-pages: 500
    image-max-bytes: 2097152
