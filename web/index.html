    position: fixed;

  .match, table tr { cursor: pointer; }
  .main.detail-main { padding: 0; background: #fff; }
  body.playing { overflow: hidden; }
  body.playing .layout { height: calc(100vh - 64px); overflow: hidden; }
  .detail { display: flex; height: calc(100vh - 64px); max-height: calc(100vh - 64px); min-height: 0; overflow: hidden; }

  .back, .line-btn {
    border: 0;

    color: #fff;
    border-radius: 8px;

  .screen-top .status-pill { margin-left: auto; background: rgba(255, 255, 255, .22); border-radius: 4px; padding: 2px 8px; }
  .screen-bottom {
    left: 24px; right: 24px; bottom: 28px;

    grid-template-columns: 1fr auto 1fr;

  .side-team { display: flex; align-items: center; gap: 10px; font-size: 18px; }
  .side-team.away { flex-direction: row-reverse; text-align: right; }

  .room { width: 360px; height: 100%; min-height: 0; background: #fff; border-left: 1px solid #f2f3f5; display: flex; flex-direction: column; overflow: hidden; }
  .room-tabs { display: flex; flex-shrink: 0; border-bottom: 1px solid #f2f3f5; }
  .room-tabs button { flex: 1; height: 48px; border: 0; background: #fff; color: #8d939c; font-size: 15px; }

  .room-body { flex: 1; min-height: 0; padding: 16px; overflow: auto; color: #555; font-size: 13px; line-height: 1.7; }
  .room-body.chat { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  .chat-list { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: scroll; padding: 12px 14px; scrollbar-gutter: stable; }
  .chat-list::-webkit-scrollbar { width: 8px; }
  .chat-list::-webkit-scrollbar-thumb { background: #c5cad3; border-radius: 4px; }
  .chat-list::-webkit-scrollbar-track { background: transparent; }
  .chat-row { margin: 0 0 10px; word-break: break-word; }
  .chat-row b { color: #20b7c8; font-weight: 600; margin-right: 6px; }
  .chat-row .pic { display: block; max-width: 168px; max-height: 168px; margin-top: 4px; border-radius: 6px; object-fit: contain; background: #f4f5f7; }
  .chat-row .badge { display: inline-block; width: 42px; height: 14px; margin-right: 4px; vertical-align: middle; object-fit: fill; }
  .chat-row .bubble {
    display: inline-block;

  .chat-row.me b { color: #e23b3b; }
  .chat-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #f2f3f5; }
  .chat-form input { flex: 1; height: 36px; border: 1px solid #e6e8eb; border-radius: 18px; padding: 0 12px; outline: none; }
  .chat-form button { height: 36px; border: 0; border-radius: 18px; background: #20b7c8; color: #fff; padding: 0 14px; }
  .detail-slot h3 { margin: 10px 0 4px; font-size: 13px; color: #20b7c8; }
  .detail-line, .hist, .live-line { display: flex; gap: 8px; padding: 7px 0; border-bottom: 1px solid #f2f4f6; font-size: 12px; line-height: 1.5; }
  .live-line b { color: #98a0aa; min-width: 36px; font-weight: 500; }
  .detail-line b, .hist b { color: #667; font-weight: 500; }
  .odd-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .odd-card { background: #f7f8fa; border-radius: 8px; padding: 10px; text-align: center; }
  .odd-card b { display: block; color: #222; font-size: 14px; }
  .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f4f5f7; }
  .closed { text-align: center; color: #9aa0a8; padding: 48px 0; }
  .line-list button { display: block; width: 100%; text-align: left; border: 0; background: #f7f8fa; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect rx="8" width="36" height="36" fill="#e23b3b"/><text x="18" y="24" text-anchor="middle" fill="#fff" font-size="16" font-family="PingFang SC, Microsoft YaHei">说</text></svg>
    <div><b>说球帝</b><small id="host"></small></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="spacer"></div>
  <button class="ghost" id="login">未登录 ▾</button>
  <div class="split"></div>
  <button class="ghost" id="app">APP客户端</button>
</header>
<div class="layout">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>
<button class="refresh" id="refresh" title="刷新">↻</button>
<div id="player"></div>
<script>
const API = "https://dgtplaoir00la.cloudfront.net";
const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
const state = {
  tab: "match",
  dates: [],
  leagues: [],
  date: "",
  type: 0,
  cid: 0,
  hot: false,
  resultOnly: false,
  page: 1,
  totalPage: 1,
  rows: [],
  loading: false,
  liveMode: "live",
  liveLeague: 0,
  liveRows: [],
  liveLoaded: false,
  scoreById: new Map(),
  dbType: 1,
  detail: null,
  detailTab: "live"
};

const $ = (id) => document.getElementById(id);
function toast(text) {
  const node = $("toast");
  node.textContent = text;
  node.style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { node.style.display = "none"; }, 1600);
}
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}
async function get(path) {
  const response = await fetch(API + path);
  const body = await response.json();
  if (!response.ok || body.code !== "0") throw new Error(body.msg || "加载失败");
  return body.data;
}
function phase(match) {
  const name = String(match.status_up_name ?? "");
  if (/上半场|下半场|中场|进行|比赛中|加时|点球/.test(name)) return "live";
  if (/完|结束|取消|腰斩|推迟|中断/.test(name)) return "done";
  if (/^\d+$/.test(name)) {
    const code = Number(match.status_up);
    if (code >= 8) return "done";
    if (code >= 3) return "live";
  }
  return "wait";
}
function statusText(match) {
  const name = String(match.status_up_name ?? "");
  if (name && !/^\d+$/.test(name)) return name;
  const code = phase(match);
  return code === "live" ? "进行中" : code === "done" ? "完场" : "未开赛";
}
function odds(value) {
  if (!value) return [];
  return String(value).split(/[,，\s]+/).filter(Boolean).slice(0, 3);
}
let flvPlayer = null;
function linesOf(match) {
  const seen = new Set();
  const result = [];
  for (const key of ["live_urls", "mirror_live_urls", "global_live_urls", "live_cartoon_url"]) {
    for (const item of match[key] || []) {
      const url = item && item.url;
      if (!url || seen.has(url)) continue;
      seen.add(url);
      result.push({
        name: item.name || "线路",
        url,
        animation: item.name === "动画" || /nami\.com|livetracker/.test(url)
      });
    }
  }
  result.sort((a, b) => Number(a.animation) - Number(b.animation));
  return result;
}
function stopPlayback() {
  if (flvPlayer) {
    try { flvPlayer.pause(); flvPlayer.unload(); flvPlayer.detachMediaElement(); flvPlayer.destroy(); } catch (error) {}
    flvPlayer = null;
  }
}
function ensureFlv() {
  if (window.flvjs) return Promise.resolve(window.flvjs);
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js";
    script.onload = () => resolve(window.flvjs);
    script.onerror = () => reject(new Error("播放器加载失败"));
    document.head.append(script);
  });
}
function playerPath(match) {
  return "/player/" + sportType(match) + "/1/0/" + match.id;
}
function readPlayerRoute() {
  const match = location.pathname.match(/^\/player\/([123])\/(\d+)\/(\d+)\/(\d+)\/?$/);
  if (!match) return null;
  return { type: Number(match[1]), playtype: match[2], channel: match[3], id: match[4] };
}
function openPlayer(match, nav) {
  state.tab = "match";
  state.detail = match;
  state.detailTab = "chat";
  const path = playerPath(match);
  if (nav !== "stay" && location.pathname !== path) {
    history.pushState({ player: String(match.id) }, "", path);
  }
  render();
}
function closePlayer() {
  if (location.pathname.startsWith("/player/")) {
    if (history.state && history.state.player) {
      history.back();
      return;
    }
    history.replaceState({}, "", "/");
  }
  state.detail = null;
  stopPlayback();
  stopRoomChat();
  stopDetailRoom();
  render();
}
async function loadPlayer(route) {
  try {
    const query = new URLSearchParams({
      mid: route.id,
      type: String(route.type),
      isnew: "1",
      pid: "4",
      langtype: "zh",
      test: "1",
      zoneId: "Asia/Shanghai"
    });
    const response = await fetch("https://kzb001.net/prod-api/match/detail?" + query);
    const body = await response.json();
    const match = body && body.data && body.data.matchinfo;
    if (!match || String(match.id) !== String(route.id)) throw new Error("这场比赛没有找到");
    if (readPlayerRoute() && readPlayerRoute().id !== String(route.id)) return;
    openPlayer(match, "stay");
  } catch (error) {
    toast(error.message || "这场比赛没有找到");
  }
}
function onRoute() {
  const route = readPlayerRoute();
  if (!route) {
    state.detail = null;
    stopPlayback();
    render();
    return;
  }
  if (state.detail && String(state.detail.id) === route.id) return;
  loadPlayer(route);
}
function drawDetail() {
  document.body.classList.add("playing");
  stopPlayback();
  stopRoomChat();
  stopDetailRoom();
  const match = state.detail;
  Object.assign(match, applyScore(match));
  const main = $("main");
  main.className = "main detail-main";
  main.textContent = "";
  $("side").style.display = "none";
  const page = el("div", "detail");
  const screen = el("section", "screen");
  const stage = el("div", "stage");
  const top = el("div", "screen-top");
  const back = el("button", "back", "返回");
  back.onclick = () => closePlayer();
  top.append(back, el("span", "status-pill", liveStatus(match)));
  const bottom = el("div", "screen-bottom");
  const home = el("div", "side-team");
  home.append(logo(match.hteam_logo, match.hteam_name), el("span", "", match.hteam_name || ""));
  const away = el("div", "side-team away");
  away.append(logo(match.ateam_logo, match.ateam_name), el("span", "", match.ateam_name || ""));
  bottom.append(home, el("div", "score-big", scoreText(match).replace(/ - /g, " : ")), away);
  const lineBar = el("div", "screen-lines");
  screen.append(stage, top, bottom, lineBar);
  const room = el("aside", "room");
  const body = el("div", "room-body");
  if (sportType(match) === 3) {
    state.detailTab = "chat";
  } else {
    const tabs = el("div", "room-tabs");
    for (const [id, label] of [["chat", "聊天"], ["live", "直播"], ["odds", "指数"], ["data", "数据"], ["tip", "预测"]]) {
      const button = el("button", state.detailTab === id ? "on" : "", label);
      button.onclick = () => { state.detailTab = id; fillRoom(body, match); tabs.querySelectorAll("button").forEach((node) => node.classList.toggle("on", node === button)); };
      tabs.append(button);
    }
    room.append(tabs);
  }
  room.append(body);
  page.append(screen, room);
  main.append(page);
  fillRoom(body, match);

  const rows = liveRows();

    const tr = document.createElement("tr");
    tr.append(el("td", "", "加载即时比分…"));
    tr.firstChild.colSpan = 8;
    table.append(tr);
  } else if (!rows.length) {
    const tr = document.createElement("tr");
    const td = el("td", "", "暂无比赛");
    td.colSpan = 8;
    tr.append(td);
    table.append(tr);
  } else {
    let section = "";
    for (const match of rows) {
      const kind = phase(match) === "wait" ? "未开始的比赛" : phase(match) === "done" ? "已结束的比赛" : "正在进行中的比赛";
      if (kind !== section) {
        section = kind;
        const tr = el("tr", "sec");
        const td = el("td", "", kind);
        td.colSpan = 8;
        tr.append(td);
        table.append(tr);
      }
      table.append(liveRow(match));
    }
  }
  board.append(table);
  main.append(board);
}
function liveRows() {
  const order = { live: 0, wait: 1, done: 2 };
  return state.liveRows.filter((match) => {
    if (state.liveLeague && match.cid !== state.liveLeague) return false;
    const kind = phase(match);
    if (state.liveMode === "result") return kind === "done";
    if (state.liveMode === "schedule") return kind === "wait";
    if (state.liveMode === "all") return true;
    return kind === "live" || kind === "wait";
  }).sort((a, b) => order[phase(a)] - order[phase(b)]);
}
function liveRow(match) {
  const tr = document.createElement("tr");
  const event = el("td");
  event.append(logo(match.clogo, match.name), document.createTextNode(" " + (match.name || "")));
  const time = String(match.matchtime || "").slice(11, 16);
  const status = el("td");
  status.append(document.createTextNode(time + " "), el("span", "st " + phase(match), statusText(match)));
  if (match.cur_round) status.append(document.createTextNode(" "), el("span", "tag", String(match.cur_round)));
  const score = el("td", phase(match) === "live" ? "sred" : "", scoreText(match));
  const extra = [];
  if (match.banchang) extra.push("半:" + match.banchang);
  if (match.jiaoqiu) extra.push("角:" + match.jiaoqiu);
  tr.append(event, status, el("td", "", match.hteam_name || ""), score, el("td", "", match.ateam_name || ""), el("td", "", odds(match.yazhi_jishi).join(" ")), el("td", "", extra.join(" ")), el("td", "", anchor(match)));
  tr.onclick = () => openPlayer(match);
  return tr;
}

function drawDb() {
  const main = $("main");
  main.textContent = "";
  main.append(el("div", "dbhead", "热门赛事"));
  const hot = el("div", "hotrow");
  for (const league of state.leagues.slice(0, 14)) {
    const button = el("button", "hot");
    button.append(logo(league.logo, league.name_zh || league.name), el("div", "", league.name_zh || league.name));
    button.onclick = () => selectLeague(league);
    hot.append(button);
  }
  main.append(hot);
  main.append(el("div", "dbhead", "积分排名"));
  const ranks = el("div", "rankrow");
  for (const label of ["FIFA排名", "热门足球", "热门篮球"]) {
    const button = el("button", "rank", label);
    button.onclick = () => toast("排名数据还没接入");
    ranks.append(button);
  }
  main.append(ranks);
  const switcher = el("div", "switch");
  for (const [type, label] of [[1, "足球"], [2, "篮球"]]) {
    const button = el("button", state.dbType === type ? "on" : "", label);
    button.onclick = () => { state.dbType = type; drawDb(); };
    switcher.append(button);
  }
  main.append(switcher);
  const zones = el("div", "zones");
  const current = el("button", "on", "全部");
  zones.append(current);
  main.append(zones);
  const grid = el("div", "leaguegrid");
  for (const league of state.leagues.filter((item) => item.type === state.dbType)) {
    const button = document.createElement("button");
    button.append(logo(league.logo, league.name_zh || league.name), el("div", "", league.name_zh || league.name));
    button.onclick = () => selectLeague(league);
    grid.append(button);
  }
  main.append(grid);
}

async function resetMatches() {
  state.page = 1;
  state.rows = [];
  state.totalPage = 1;
  render();
  await loadMatches(true);
}
async function loadMatches(replace) {
  if (!state.date || state.loading) return;
  state.loading = true;
  const onPlayer = () => state.detail && state.tab === "match";
  if (!onPlayer()) render();
  try {
    const page = replace ? 1 : state.page + 1;
    const query = new URLSearchParams({
      isfanye: "1",
      type: String(state.type || 0),
      cid: String(state.cid || 0),
      ishot: state.hot ? "1" : "-1",
      langtype: "zh",
      pid: "4",
      zoneId: "Asia/Shanghai",
      zhuboType: "0",
      starttime: state.date,
      pn: String(page),
      ps: "30"
    });
    const data = await get("/prod-api/match/list/new?" + query.toString());
    const batch = page === 1 ? [...(data.notopList || []), ...(data.topList || []), ...(data.dataList || [])] : (data.dataList || []);
    state.rows = replace ? batch : state.rows.concat(batch);
    state.page = data.currentPage || page;
    state.totalPage = data.totalPage || 1;
  } catch (error) {
    toast(error.message || "比赛加载失败");
  } finally {
    state.loading = false;
    if (!(state.detail && state.tab === "match")) render();
  }
}
function applyScore(match) {
  if (!match) return match;
  const fresh = state.scoreById.get(Number(match.id));
  if (!fresh) return match;
  const next = {};
  for (const key of SCORE_KEYS) {
    if (fresh[key] != null && fresh[key] !== "") next[key] = fresh[key];
  }
  return next;
}
function rememberScores(rows) {
  for (const match of rows) state.scoreById.set(Number(match.id), match);
}
async function fetchScorePage(page) {
  const query = new URLSearchParams({ type: "0", cid: "0", ishot: "-1", pn: String(page), ps: "200" });
  const response = await fetch(SCORE_API + "/prod-api/match/list/new2?" + query);
  const body = await response.json();
  if (!response.ok || String(body.code) !== "0") throw new Error((body && body.msg) || "即时比分加载失败");
  return body.data || {};
}
function paintScores() {
  for (const node of document.querySelectorAll(".match[data-id]")) {
    const row = state.rows.find((match) => String(match.id) === node.dataset.id);
    if (!row) continue;
    Object.assign(row, applyScore(row));
    const score = node.querySelector(".score");
    if (score) {
      const text = scoreText(row);
      score.textContent = text;
      score.classList.toggle("vs", text === "VS");
    }
    const status = node.querySelector(".when .st");
    if (status) {
      status.textContent = liveStatus(row);
      status.className = "st " + phase(row);
    }
    const bits = [];
    if (row.banchang) bits.push("半:" + row.banchang);
    if (row.jiaoqiu) bits.push("角:" + row.jiaoqiu);
    let extra = node.querySelector(".extra");
    if (bits.length) {
      if (!extra) {
        extra = el("div", "extra");
        const meta = node.querySelector(".meta");
        const anchorNode = meta && meta.querySelector(".anchor");
        if (anchorNode) anchorNode.after(extra);
        else if (meta) meta.prepend(extra);
      }
      extra.textContent = bits.join(" ");
    } else if (extra) extra.remove();
    const left = node.querySelector(".odds");
    if (left) {
      left.textContent = "";
      for (const part of odds(row.yazhi_jishi)) left.append(el("span", "", part));
    }
  }
  if (state.detail) {
    Object.assign(state.detail, applyScore(state.detail));
    const big = document.querySelector(".score-big");
    if (big) big.textContent = scoreText(state.detail).replace(/ - /g, " : ");
    const pill = document.querySelector(".status-pill");
    if (pill) pill.textContent = liveStatus(state.detail);
  }
}
async function refreshScores() {
  const data = await fetchScorePage(1);
  rememberScores([...(data.notopList || []), ...(data.topList || []), ...(data.dataList || []), ...(data.overList || []), ...(data.otherList || [])]);
  paintScores();
}
async function loadLive() {
  if (state.loading) return;
  state.loading = true;
  if (!state.liveRows.length) render();
  try {
    const rows = [];
    let page = 1;
    let total = 1;
    while (page <= total && page <= 3) {
      const data = await fetchScorePage(page);
      if (page === 1) rows.push(...(data.notopList || []), ...(data.topList || []), ...(data.overList || []), ...(data.otherList || []));
      rows.push(...(data.dataList || []));
      total = data.totalPage || 1;
      page += 1;
    }
    rememberScores(rows);
    state.liveRows = rows;
    state.liveLoaded = true;
  } catch (error) {
    state.liveLoaded = true;
    toast(error.message || "即时比分加载失败");
  } finally {
    state.loading = false;
    render();
  }
}
async function boot() {
  window.addEventListener("popstate", onRoute);
  $("host").textContent = "";
  $("login").onclick = () => toast("登录暂未开放");
  $("app").onclick = () => toast("客户端暂未开放");
  $("refresh").onclick = () => {
    if (state.tab === "live") { state.liveLoaded = false; state.liveRows = []; loadLive(); }
    else if (state.tab === "match") resetMatches();
    else render();
  };
  render();
  try {
    const [dates, categories] = await Promise.all([
      get("/prod-api/match/date/count?type=-1&cid=0"),
      get("/prod-api/category/list?type=0&isoften=1&ishot=1&langtype=zh")
    ]);
    state.dates = dates || [];
    state.leagues = (categories && categories.twoCategoryList) || [];
    const key = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    state.date = state.dates.some((item) => item.matchdate === key) ? key : (state.dates[0] && state.dates[0].matchdate) || key;
  } catch (error) {
    toast(error.message || "接口加载失败");
  }
  render();
  const route = readPlayerRoute();
  if (route) loadPlayer(route);
  if (state.tab === "match") loadMatches(true);
}
const originalRender = render;
render = function () {
  originalRender();
  if (state.tab === "live" && !state.liveLoaded && !state.loading) loadLive();
};
setInterval(() => {
  if (document.visibilityState === "hidden") return;
  refreshScores().catch(() => {});
  if (state.tab === "live" && !state.loading) loadLive();
}, 30000);
boot();
refreshScores().catch(() => {});
</script>
</body>
</html>
